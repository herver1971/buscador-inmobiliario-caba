  - {nombre: Hospital de Clinicas UBA, tipo: hospital_publico, direccion: "Cordoba 2351", radio_m: 800, bonus: 2.0}
  - {nombre: Hospital Durand, tipo: hospital_publico, direccion: "Diaz Velez 5044", radio_m: 700, bonus: 1.5}
  - {nombre: Hospital Fernandez, tipo: hospital_publico, direccion: "Cervino 3356", radio_m: 700, bonus: 1.5}
